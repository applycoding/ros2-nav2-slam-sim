name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest

  colcon-build:
    name: colcon build
    runs-on: ubuntu-latest
    # Optional relative to pull requests. It only compiles the workspace.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Build in ROS 2 Humble
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/ws" -w /ws ros:humble-ros-base bash -lc '
            apt-get update &&
            apt-get install -y --no-install-recommends python3-colcon-common-extensions build-essential &&
            source /opt/ros/humble/setup.bash &&
            colcon build --symlink-install
          '
